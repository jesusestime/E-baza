    <!-- Select 2 import-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js" defer></script>
    <script>
     
            $(document).ready(function () {
              var dataTable = $('#example4').DataTable({
                pageLength: 5, // Affiche 5 entrées par page
                dom: 'Bfrtip',
                buttons: [
                  'copy', 'excel', 'pdf', 'print'
                ]
              });
        
              // Populate select options
              function populateSelectOptions(columnIndex, selectId) {
                var columnData = dataTable.column(columnIndex).data().unique().sort();
                var select = $('#' + selectId);
                select.empty();
                select.append('<option value=""></option>');
                columnData.each(function (data) {
                  select.append('<option value="' + data + '">' + data + '</option>');
                });
              }
        
              // Initialize select2 for each select element
              function initializeSelect2(selectId) {
                $('#' + selectId).select2();
              }
        
              // Handle select change event
              function handleSelectChange(columnIndex, selectId) {
                $('#' + selectId).on('change', function () {
                  var selectedValues = $(this).val();
                  dataTable.column(columnIndex).search(selectedValues.join('|'), true, false).draw();
                });
              }
              $('#general-search').on('keyup', function() {
                dataTable.search(this.value).draw();
              });
        
              // Populate and initialize select elements for each column
              dataTable.columns().every(function () {
                var columnIndex = this.index();
                var selectId = this.header().textContent.toLowerCase().replace(/ /g, '-') + '-select';
                populateSelectOptions(columnIndex, selectId);
                initializeSelect2(selectId);
                handleSelectChange(columnIndex, selectId);
              });
            });
          </script>

    </script>
