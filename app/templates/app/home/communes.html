{% extends 'app/layouts/default.html' %} {% block content %}
{% load static %}


<!-- page content -->
    <div id="capp-content">

      <div class="app-content-area container">

    
      


<h1 class="text-gray mb-4 fw-semi-bold card  my-5 px-5 py-3">Communes de la Province {{ province}} </h1>
          <div class="row">
            <div class="col-xl-12 col-md-12 col-12 mb-5">
              <div class="row row-cols-lg-2 row-cols-1 g-5  ">
              {% if communes %}
              {% for commune in communes %}
                <div class="col">
                  <div class="card h-100 card-lift">
                    <div class="card-body btn btn-white">
                      <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-semi-bold "> <a href="{% url 'themes' commune.id %}">{{ commune.name }}</a></span>
                    
                      </div>
                      
                    </div>
                  </div>
                </div>
            {% endfor %}

            {% else %}
            <p>Aucune donnée communes disponible pour ce province.</p>
            {% endif %}
              </div>
            </div>
          </div>
           <div class="grid gap-6 mb-8 md:grid-cols-12 card h-100 card-lift  rounded-3">
        
        </div>
      </div>
    </div>
{% endblock %}
