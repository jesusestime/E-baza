{% extends 'app/layouts/default.html' %} {% block content %}
{% load static %}


<!-- page content -->
    <div id="capp-content">

      <div class="app-content-area container">

    
      


<h1 class="text-gray mb-4 fw-semi-bold my-5 py-3">Les périodes > {{ region }}</h1>
          <div class="row">
            <div class="col-xl-12 col-md-12 col-12 mb-5">
              <div class="row row-cols-lg-2 row-cols-1 g-5  ">
                {% if periodes %}
                <form>
                  <div class="col">
                    <div class="h-100 card-lift">
                      <div class="">
                        <div class="d-flex justify-content-between align-items-center">
                          <select onchange="window.location.href=this.value" class="form-select">
                            <option value="" disabled selected>Choisir une période</option>
                            {% for periode in periodes %}
                              <option value="{% url 'fiche' periode.region.indicateur.theme.id periode.region.indicateur.id periode.region.id periode.id %}">{{ periode.year }}</option>
                            {% endfor %}
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>
                </form>
        

            {% else %}
            <p>Aucune donnée périodes disponible pour ses regions.</p>
            {% endif %}
              </div>
            </div>
          </div>
           <div class="grid gap-6 mb-8 md:grid-cols-12 card h-100 card-lift  rounded-3">
        
        </div>

        <div class="block">

          <a class=" btn btn-primary" href="{% url 'region'  region.indicateur.theme.id region.indicateur.id %}">Retour</a>
      </div>
      </div>
      
      </div>
    </div>
{% endblock %}
