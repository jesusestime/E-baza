{% extends 'app/layouts/default.html' %} {% block content %}
{% load static %}


<!-- page content -->
    <div id="capp-content">

      <div class="app-content-area container">

    
      


<h1 class="text-gray mb-4 fw-semi-bold my-5 py-3">Les sous-thèmes > {{ theme }} </h1>
          <div class="row">
            <div class="col-xl-12 col-md-12 col-12 mb-5">
              <div class="row row-cols-lg-2 row-cols-1 g-5  ">
                {% if indicateurs %}
                <form>
                  <div class="col">
                    <div class="h-100 card-lift ">
                      <div class="">
                        <div class="d-flex justify-content-between align-items-center">
                          <select onchange="window.location.href=this.value" class="form-select">
                            <option value="" disabled selected>Choisir un indicateur</option>
                            {% for indicateur in indicateurs %}
                              <option value="{% url 'region' indicateur.theme.id indicateur.id %}">{{ indicateur.name }}</option>
                            {% endfor %}
                          </select>
                        </div>
                      </div>
                    </div>
                  </div>
                </form>
             

            {% else %}
            <p>Aucune donnée communes disponible pour ses indicateurs.</p>
            {% endif %}
            
</div>
              </div>
            </div>
            <div class="block">

              <a class=" btn btn-primary" href="{% url 'theme'  %}">Retour</a>
          </div>
          </div>
          
           <div class="grid gap-6 mb-8 md:grid-cols-12 card h-100 card-lift  rounded-3">
        
        </div>
      </div>
      
    </div>
    
{% endblock %}
